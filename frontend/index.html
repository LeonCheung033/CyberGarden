<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁用缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sonic Bloom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }
        #c {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #b8d4e3;
            font-size: 13px;
            text-shadow: 0 0 8px rgba(184, 212, 227, 0.5);
            z-index: 100;
            font-weight: 300;
            line-height: 1.8;
            background: rgba(26, 26, 31, 0.6);
            padding: 15px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(184, 212, 227, 0.2);
        }
        .info-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(184, 212, 227, 0.15);
        }
        .info-section:first-child {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }
        .info-label {
            color: #a8c8ec;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .info-value {
            color: #e8c5d8;
            font-size: 14px;
        }
        .info-effect {
            color: #b8d4e3;
            font-size: 11px;
            margin-top: 2px;
            font-style: italic;
            opacity: 0.8;
        }
        .bar-container {
            width: 200px;
            height: 4px;
            background: rgba(184, 212, 227, 0.2);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #b8d4e3, #e8c5d8);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #b8d4e3;
            font-size: 12px;
            opacity: 0.6;
            z-index: 100;
        }
        .voice-interaction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 31, 0.9);
            padding: 30px 40px;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(184, 212, 227, 0.3);
            z-index: 200;
            text-align: center;
            min-width: 400px;
            display: none;
        }
        .voice-interaction.active {
            display: block;
        }
        .voice-prompt {
            color: #b8d4e3;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .voice-button {
            background: linear-gradient(135deg, #b8d4e3, #e8c5d8);
            color: #1a1a1f;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        .voice-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(184, 212, 227, 0.5);
        }
        .voice-button:active {
            transform: scale(0.95);
        }
        .voice-button.recording {
            background: linear-gradient(135deg, #ff6b9d, #ff8c94);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .voice-status {
            color: #a8c8ec;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
    <!-- 加载本地 TensorFlow.js 和 Pose Detection -->
    <script src="lib/tensorflow/tf.min.js"></script>
    <script src="lib/pose-detection/pose-detection.min.js"></script>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="fps-counter" id="fps-counter">FPS: 60</div>
    
    <!-- 语音交互界面 -->
    <div class="voice-interaction" id="voice-interaction">
        <div class="voice-prompt" id="voice-prompt">How was your day?</div>
        <button class="voice-button" id="voice-button">🎤 Start Recording</button>
        <div class="voice-status" id="voice-status"></div>
    </div>
    
    <div class="info">
        <div style="font-size: 16px; margin-bottom: 8px;">🌺 Cyber Garden</div>
        <div id="status">连接中...</div>
        
        <div class="info-section">
            <div class="info-label">🎭 表情特征</div>
            <div class="info-value" id="emotion-display">-</div>
            <div class="info-effect" id="emotion-effect">-</div>
        </div>
        
        <div class="info-section">
            <div class="info-label">🔊 声音特征</div>
            <div style="margin-top: 6px;">
                <div style="margin-bottom: 6px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                        <span class="info-value" style="font-size: 12px;">响度</span>
                        <span class="info-value" style="font-size: 12px;" id="loudness-value">0%</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" id="loudness-bar" style="width: 0%;"></div>
                    </div>
                    <div class="info-effect" id="loudness-effect">-</div>
                </div>
                <div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                        <span class="info-value" style="font-size: 12px;">音高</span>
                        <span class="info-value" style="font-size: 12px;" id="pitch-value">- Hz</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" id="pitch-bar" style="width: 0%;"></div>
                    </div>
                    <div class="info-effect" id="pitch-effect">-</div>
                </div>
            </div>
        </div>
        
        <div class="info-section">
            <div class="info-label">✋ 手势识别</div>
            <div class="info-value" id="gesture-status" style="font-size: 12px;">等待检测...</div>
            <div class="info-effect" id="gesture-detail">-</div>
            <div class="info-effect" id="gesture-direction" style="margin-top: 4px;">-</div>
        </div>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js",
            "@tensorflow-models/pose-detection": "https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.2.0/dist/pose-detection.min.js",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
            "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.35.3/build/postprocessing.js"
        }
    }
    </script>
    <script type="module" src="main.js?v=202511123900"></script>
</body>
</html>
